# Serves ai-development-source-data/business-website-policy-documents (mounted read-only)
# at http://localhost:${WEBSITES_PORT}/business-website-policy-documents/
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative, so they work whatever host port is mapped
    absolute_redirect off;

    location = / {
        return 302 /business-website-policy-documents/;
    }

    # Build scripts and notes are not part of the sites
    location ~ ^/business-website-policy-documents/(_tools|.*\.py$|ToDo\.md$) {
        return 404;
    }

    # /business-website-policy-documents/<company>/ -> the company's website
    location ~ ^/business-website-policy-documents/([^/]+)/$ {
        if (-f $document_root/business-website-policy-documents/$1/website/index.html) {
            return 302 website/;
        }
        autoindex on;
    }

    # Folder listing, so newly added companies show up without config changes
    location /business-website-policy-documents/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
