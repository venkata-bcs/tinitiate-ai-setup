faq_intro: Answers to common questions about Atlas accounts and services.
faq:
  - { q: "What ID do I need to open an account?", a: "One unexpired government photo ID such as a driver's licence, passport or Green Card. Some IDs (e.g. Matricula Consular, IDNYC) need a secondary ID. See ATL-CUS-001." }
  - { q: "When will my deposited check be available?", a: "Usually on the next business day. The first USD 275 is always available next day. Larger or unusual deposits may be held up to 7 business days. See ATL-CUS-004." }
  - { q: "Does Atlas charge overdraft fees?", a: "USD 25 per item, up to 2 per day. There is no fee if you are overdrawn by USD 50 or less, and no NSF fees at all. Debit card overdrafts need your opt-in." }
  - { q: "Someone used my debit card. What do I do?", a: "Lock your card in Atlas Mobile and call 1-800-555-0142 right away. Report within 2 business days to limit liability to USD 50; Zero Liability usually means USD 0. See ATL-CUS-005." }
  - { q: "Can I get my money back if I was scammed on Zelle?", a: "Payments you authorised are generally not reversible, but Atlas reimburses eligible imposter scams reported within 30 days. Atlas will never ask you to send money to yourself." }
  - { q: "How do I stop Atlas sharing my information with affiliates?", a: "Call 1-800-555-0148, visit the privacy page, or mail the opt-out form in our Privacy Notice (ATL-CUS-006)." }
  - { q: "What happens to an account I don't use?", a: "After 12 months without activity it becomes inactive; after 24 months it is dormant. After about 3 years (varies by state), funds go to the state unclaimed property office." }
  - { q: "Do branches close for hurricanes or snowstorms?", a: "Branches may close for public-safety reasons. Closures are posted in Atlas Mobile and on the Alerts page; ATMs and digital banking remain available." }

