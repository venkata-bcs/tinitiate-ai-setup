about:
  summary: A community-minded national bank headquartered in Baltimore, serving the East Coast for nearly a century.
  mission: Help families and small businesses on the East Coast build financial strength - honestly, simply and close to home.
  story:
    - >-
      Atlas began in 1927 as Atlas Mutual Savings, a savings bank founded by Baltimore dock workers and shopkeepers. It survived
      the Depression by never closing its doors, and became known as the bank "that holds up the neighbourhood".
    - >-
      Through careful mergers with community banks in Pennsylvania, New York, New England and the Carolinas, Atlas has grown to
      USD 48.6 billion in assets. Each branch still has local lending authority and a community advisory board.
  values:
    - { title: Integrity, text: "Do the right thing, especially when no one is watching." }
    - { title: Customer first, text: "No product sales quotas; recommend only what meets the customer's needs." }
    - { title: Respect, text: "Every customer and colleague is treated with dignity." }
    - { title: Stewardship, text: "Protect our customers' trust and the bank's safety and soundness." }
  timeline:
    - { year: 1927, event: "Atlas Mutual Savings opens on Pratt Street, Baltimore." }
    - { year: 1968, event: "Converts to a national bank charter as Atlas Retail Bank, N.A." }
    - { year: 1994, event: "Expands into Pennsylvania and Delaware." }
    - { year: 2008, event: "Acquires Hudson Valley Savings (fictional), entering New York." }
    - { year: 2016, event: "Enters the Carolinas and Georgia." }
    - { year: 2022, event: "Eliminates NSF fees for all personal accounts." }
    - { year: 2025, event: "Launches Atlas Fresh Start Checking (second-chance banking)." }

