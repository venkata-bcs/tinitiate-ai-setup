about:
  summary: A Singapore-headquartered carrier connecting Asia with the Americas, Europe and the Indian Subcontinent since 1998.
  mission: Move our customers' cargo safely, reliably and sustainably, while caring for the people who make it happen at sea and ashore.
  story:
    - >-
      OceanX was founded in 1998 by a group of Singaporean ship managers with two 1,100 TEU feeder vessels serving Port Klang,
      Jakarta and Singapore. Strong intra-Asia growth led to the first deep-sea service, the Transpacific "PNX" loop, in 2006.
    - >-
      Today OceanX Logistics Group operates 38 owned and 21 chartered container ships, employs 4,850 shore staff and 6,200
      seafarers, and runs its own terminals in Singapore and Navi Mumbai. Our regional hubs in Shanghai, Long Beach and Rotterdam
      bring us close to customers in every major trade lane.
  values:
    - { title: Safety first, text: "Anyone, anywhere, may stop work they believe is unsafe." }
    - { title: Accountability, text: "We own our commitments to customers, colleagues and communities." }
    - { title: Integrity, text: "Zero tolerance for bribery, sanctions breaches and misdeclaration." }
    - { title: Long-term thinking, text: "Net-zero owned fleet by 2050; cadet programme training 120 officers a year." }
  timeline:
    - { year: 1998, event: "Founded in Singapore with two feeder vessels." }
    - { year: 2006, event: "First Transpacific service (Shanghai - Long Beach)." }
    - { year: 2011, event: "Opened OceanX Logistics Europe B.V. in Rotterdam." }
    - { year: 2015, event: "Launched OX Navigator digital booking portal." }
    - { year: 2019, event: "Delivery of flagship OX Meridian (15,200 TEU)." }
    - { year: 2024, event: "First LNG dual-fuel vessel, OX Nordlys, joins the fleet." }
    - { year: 2026, event: "Customs brokerage expanded to India and the EU." }

