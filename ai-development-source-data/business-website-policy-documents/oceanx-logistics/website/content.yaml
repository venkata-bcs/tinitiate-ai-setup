faq_intro: Answers to the questions our customer service teams hear most often.
faq:
  - { q: "How do I open an account with OceanX?", a: "Register on OX Navigator and upload your company registration, tax ID and authorised signatory ID. Most accounts are approved within 3 business days. See OX-CUS-001." }
  - { q: "Which payment methods do you accept in China?", a: "Domestic bank transfer (CNAPS), corporate online banking and, for amounts up to CNY 50,000, Alipay or WeChat Pay corporate accounts. Ocean freight in USD needs SAFE-compliant documents. See OX-CUS-002." }
  - { q: "Can I pay by UPI in India?", a: "Yes. UPI for business is accepted up to INR 2 lakh per transaction. NEFT and RTGS are available for larger amounts." }
  - { q: "How long is free time on import containers in the USA?", a: "4 days of demurrage and 4 days of detention on the West Coast; 5 and 4 days on the East and Gulf Coasts. Reefers receive half. See OX-CUS-005." }
  - { q: "How do I dispute a demurrage invoice?", a: "Use OX Navigator > Billing > Dispute within 30 days of the invoice date. Pay the undisputed amount; the disputed part is put on hold. See OX-CUS-003." }
  - { q: "Do you ship lithium batteries?", a: "Yes, as Class 9 dangerous goods with a lithium battery declaration. Damaged or recalled batteries are never accepted. See OX-CUS-006." }
  - { q: "What is the SI cut-off?", a: "48 hours before vessel departure for cargo bound for the US, Canada, the EU and China, because of advance manifest rules." }
  - { q: "How much is OceanX liable for if my cargo is damaged?", a: "Under the Hague-Visby Rules, 666.67 SDR per package or 2 SDR per kg, whichever is higher. US COGSA limits liability to USD 500 per package. We recommend cargo insurance. See OX-CUS-007." }
  - { q: "Someone emailed me new OceanX bank details. Is it genuine?", a: "Treat it as fraud until verified. OceanX bank details are only published on OX Navigator and signed invoices. Call +65 6555 0188." }

