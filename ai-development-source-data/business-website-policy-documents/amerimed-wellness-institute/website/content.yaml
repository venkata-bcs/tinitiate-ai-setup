about:
  summary: A nonprofit integrated health system serving California, Oregon, Washington and Nevada.
  mission: To deliver whole-person care, close to home, for every community we serve - regardless of ability to pay.
  story:
    - >-
      Amerimed began in 1964 as the Pacific Crest Wellness Clinic in San Jose, founded by three physicians and a public health
      nurse to bring preventive care to farm-worker and factory families in the Santa Clara Valley.
    - >-
      Today Amerimed Wellness Institute has 26,500 caregivers, six hospitals from Long Beach to Seattle, and one of the West
      Coast's largest telehealth programmes. As a 501(c)(3) nonprofit, we reinvest every dollar in care, community health and
      education for the next generation of clinicians.
  values:
    - { title: Compassion, text: "We treat every patient as we would want our families treated." }
    - { title: Accountability, text: "We measure outcomes, share them openly and learn from mistakes." }
    - { title: Respect, text: "Care free from discrimination, in your language and honouring your culture." }
    - { title: Excellence, text: "Evidence-based care, ambitious safety goals and continuous improvement." }
  timeline:
    - { year: 1964, event: "Pacific Crest Wellness Clinic opens in San Jose." }
    - { year: 1979, event: "Amerimed Pacific Medical Center opens (now 520 beds)." }
    - { year: 1995, event: "Merger with Bayview Community Hospital, San Francisco." }
    - { year: 2007, event: "Expansion to Oregon with Willamette Medical Center." }
    - { year: 2014, event: "Amerimed Cascade Hospital opens in Seattle." }
    - { year: 2020, event: "Launch of Amerimed Anywhere 24/7 telehealth." }
    - { year: 2026, event: "First urgent care centres open in Nevada." }

