policies_intro: >-
  Patient rights, privacy, financial assistance, billing and clinical policies of Amerimed Wellness Institute (fictional).
  These documents are samples for AI training and are not medical or legal advice.

faq_intro: Answers to common patient questions about appointments, billing and privacy.
faq:
  - { q: "Do I need insurance to be seen?", a: "No. Emergency care is provided regardless of ability to pay. Uninsured patients get a 40% self-pay discount, a Good Faith Estimate and screening for financial assistance." }
  - { q: "Who qualifies for free care?", a: "At our California hospitals, households up to 300% of the federal poverty level qualify for free care, with discounts above that. Oregon and Washington have their own scales. See AMW-PAT-003." }
  - { q: "How do I get a copy of my medical records?", a: "Most records are available instantly in MyAmerimed. Otherwise contact Health Information Management; we respond within 15 days. See AMW-PAT-002." }
  - { q: "I got a bill from an out-of-network doctor at an Amerimed hospital. Do I have to pay it?", a: "For emergency care and most care at in-network hospitals, you owe only your in-network cost-sharing. Call 1-888-555-0127 or the No Surprises Help Desk at 1-800-985-3059." }
  - { q: "Can I use telehealth when I'm travelling?", a: "Only when you are physically in a state where your clinician is licensed (CA, OR, WA or NV)." }
  - { q: "Can a teenager see a doctor without a parent?", a: "For some sensitive services, yes, depending on state law. In California, minors 12+ can consent to certain mental health and reproductive health services." }
  - { q: "Will Amerimed report my medical debt to credit bureaus?", a: "No. Amerimed does not report medical debt to credit bureaus at any facility." }
  - { q: "How do I raise a concern about my care?", a: "Speak with your nurse or clinic manager, or call Patient Experience at 1-888-555-0125. You can also contact the state health department directly." }

